<script src="lib.js"></script>
<script src="sound.js"></script>
<script src="stream.js"></script>
<script src="story.js"></script>
<script src="feed.js"></script>
<script src="sketch.js"></script>
<script>
  const stage = document.getElementById('stage')
  const params = new URLSearchParams(location.search)
  const scripted = params.has('script')
  let examples = params.get('examples') !== 'off'
  // One colour per session, shared by its walker on the map and its card in the sessions panel.
  const SESSION_COLORS = [[232, 84, 54], [46, 116, 190], [122, 92, 190], [30, 128, 112]]
  const sessionColors = new Map()
  const colorOf = (session) => {
    if (!sessionColors.has(session)) sessionColors.set(session, SESSION_COLORS[sessionColors.size % SESSION_COLORS.length])
    return sessionColors.get(session)
  }
  const prices = new Map()
  const sound = createSound()
  // The only calls the room hears are the ones that failed, and only once traces can show them.
  const heard = (event) => event.error && sound.fail()
  const feed = createFeed(document.querySelector('.feed'), colorOf, (id) => prices.get(id))
  const played = {}
  let example
  let onMap = false
  let scene
  let installed = false

  function setInstalled(value) {
    installed = value
    document.querySelector('.legend').dataset.on = String(value)
    scene.setInstalled(value)
    if (value) sound.stamp()
    showRuns()
  }

  // The three levels of sight: 1 is a server with no observability, 2 adds traces and logs, 3 adds
  // MCP Analytics. Only level 3 has the analytics view of the map.
  let level = 1
  const STANDING = { 1: 'No observability', 2: 'Traces and logs' }
  function setLevel(value, arriving) {
    level = value
    document.body.dataset.level = value
    if (value < 3) document.querySelector('.legend .stamp[data-view="before"]').textContent = STANDING[value]
    feed.setLevel(value)
    if ((value === 3) !== installed) setInstalled(value === 3)
    // Arriving at a level tells its story. A further press on the same stop does not start it over.
    if (arriving) retell(value)
  }

  // Every call each server has received, in order, so a level can tell the errand again from the start.
  const seen = { raw: [], instrumented: [] }
  const told = new Set()
  let telling
  // The action in the customer's conversation that the server's side is showing right now.
  let cursor

  // Each time a level opens, the errand is told again one action at a time: the action lights up
  // in the customer's conversation, something crosses the line, and the server's side shows what this
  // level recorded of it. That pairing, action by action, is the point of the talk.
  // Settles a telling that was cut short, so what it had not yet shown is still on record.
  let abandon
  function retell(value) {
    abandon?.()
    clearTimeout(telling)
    cursor = undefined
    const channel = value === 3 ? 'instrumented' : 'raw'
    const events = seen[channel].slice()
    if (!events.length) return
    // Coming back to a level starts from a clean map, so the marks of the last telling are not doubled.
    if (told.size) {
      mount()
      fit()
    }
    told.add(value)
    if (value >= 2) unseen.length = 0
    if (value === 3) held.length = 0
    feed.rewind(channel)
    const order = new Map()
    let i = 0
    // The action that has left the conversation and is not in the log yet.
    let inFlight
    const record = (event) => {
      if (inFlight !== event) return
      inFlight = undefined
      feed.add(event)
    }
    const finish = () => {
      abandon = undefined
      cursor = undefined
      shownRuns = ''
      showRuns()
    }
    // Leaving before the story is over, even before its first action, ends it at once: nothing of
    // it stays in the air, and the rest is recorded plainly.
    abandon = () => {
      clearTimeout(telling)
      for (const chip of document.querySelectorAll('.spark')) chip.remove()
      if (inFlight) record(inFlight)
      for (const event of events.slice(i)) feed.add(event)
      i = events.length
      finish()
    }
    const next = () => {
      if (level !== value || clientSide) return abandon()
      const event = events[i++]
      if (!event) return finish()
      const index = order.get(event.run) ?? 0
      order.set(event.run, index + 1)
      cursor = { run: String(event.run), index }
      shownRuns = ''
      showRuns()
      inFlight = event
      const began = performance.now()
      // At level 3 the customer's figure sets the pace. It sets off as the action leaves, the record
      // lands when it gets to the tool, and the next action waits for that, so the map and the log
      // never run ahead of each other.
      const walked =
        value === 3
          ? new Promise((arrived) => {
              event.arrived = arrived
              setTimeout(arrived, 6000)
              draw(event)
            })
          : undefined
      // One action, three beats: it leaves the conversation, it reaches the tool, it becomes a record.
      // The server's side only changes when the marker gets there, so cause is always seen before effect.
      cross(
        event,
        value,
        () => {
          if (level !== value || value !== 2) return
          scene.onEvent(event)
          heard(event)
        },
        () => {
          if (inFlight !== event) return
          record(event)
          if (walked) telling = setTimeout(next, Math.max(700, PACE[value] - (performance.now() - began)))
        },
        walked
      )
      if (!walked) telling = setTimeout(next, PACE[value])
    }
    // The analytics map takes a few seconds to colour in the first time, and journeys wait for it.
    telling = setTimeout(next, value === 3 ? 4200 : 500)
  }
  // Slow enough to read each action as it happens. At level 3 this is the least an action takes: its
  // figure has to walk there, and a long walk takes longer.
  const PACE = { 1: 1200, 2: 1600, 3: 1800 }

  // What crosses the line for one action, written on the thing that crosses. At level 1 that is only a
  // status code. From level 2 it is the tool and its result. The reason, at level 3, is shown in one
  // place only: beside the customer's figure on the map.
  function crossing(event, value) {
    if (value === 1) return ['200', '#6b7080']
    return [`${event.tool} ${event.error ? '✕' : '✓'}`, event.error ? '#f54e00' : '#151b2e']
  }

  // The marker travels from the action in the customer's conversation, across the line, to that tool's
  // place on the map, and then down to the log. `reached` runs when it gets to the tool and `recorded`
  // when it gets to the log. At level 1 the server does not know which tool it was, so the marker goes
  // straight to the log. Given `walked`, the marker waits at the tool until that settles, which is how
  // it keeps step with the figure walking there.
  function cross(event, value, reached, recorded, walked) {
    const from = claude.querySelector('.use[data-now]')?.getBoundingClientRect()
    const log = [...document.querySelectorAll('.feed .record')].find((list) => list.offsetParent)?.getBoundingClientRect()
    if (!from?.width || !log?.width || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      reached()
      return walked ? void walked.then(recorded) : recorded()
    }
    const label =
      value > 1
        ? [...stage.querySelectorAll('.name')].find(
            (name) => name.textContent.trim().startsWith(event.tool) && getComputedStyle(name).visibility !== 'hidden'
          )
        : undefined
    const place = label?.getBoundingClientRect()
    const [text, color] = crossing(event, value)
    const chip = document.createElement('i')
    chip.className = 'spark'
    chip.textContent = text
    chip.style.background = color
    document.body.append(chip)

    const at = (x, y, scale = 1) => `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale})`
    const glide = 'cubic-bezier(0.45, 0, 0.2, 1)'
    const start = [from.left + 60, from.top + from.height / 2]
    const end = [log.left + 150, log.bottom - 20]
    const tool = place?.width ? [place.left + place.width / 2, place.top - 16] : undefined
    // The tool answers an arrival with a small beat on its name.
    const beat = () => label?.animate([{ scale: 1 }, { scale: 1.2, offset: 0.35 }, { scale: 1 }], { duration: 380, easing: 'ease-out' })
    if (tool && walked) {
      const out = chip.animate(
        [
          { transform: at(...start, 0.9), opacity: 0, easing: 'ease-out' },
          { transform: at(...start), opacity: 1, offset: 0.1, easing: glide },
          { transform: at(...tool), opacity: 1 },
        ],
        { duration: 1200, fill: 'forwards' }
      )
      Promise.all([out.finished, walked])
        .then(() => {
          reached()
          beat()
          return chip.animate(
            [
              { transform: at(...tool), opacity: 1, easing: glide },
              { transform: at(...end), opacity: 1, offset: 0.85, easing: 'ease-in' },
              { transform: at(...end, 0.96), opacity: 0 },
            ],
            { duration: 420, fill: 'forwards' }
          ).finished
        })
        .then(recorded, recorded)
        .finally(() => chip.remove())
      return
    }
    const frames = tool
      ? [
          { transform: at(...start, 0.9), opacity: 0, easing: 'ease-out' },
          { transform: at(...start), opacity: 1, offset: 0.08, easing: glide },
          { transform: at(...tool), opacity: 1, offset: 0.48, easing: 'linear' },
          { transform: at(...tool), opacity: 1, offset: 0.64, easing: glide },
          { transform: at(...end), opacity: 1, offset: 0.94, easing: 'ease-in' },
          { transform: at(...end, 0.96), opacity: 0 },
        ]
      : [
          { transform: at(...start, 0.9), opacity: 0, easing: 'ease-out' },
          { transform: at(...start), opacity: 1, offset: 0.12, easing: glide },
          { transform: at(...end), opacity: 1, offset: 0.9, easing: 'ease-in' },
          { transform: at(...end, 0.96), opacity: 0 },
        ]
    const duration = tool ? 1150 : 700
    chip.animate(frames, { duration }).finished.finally(() => chip.remove())
    setTimeout(() => {
      reached()
      beat()
    }, tool ? duration * 0.48 : 0)
    const landed = new Promise((done) => setTimeout(done, duration * 0.92))
    Promise.all([landed, walked]).then(recorded)
  }

  const held = []
  let clientSide = false
  // True while a saved session is being read back in, so nothing is drawn or sounded for it yet.
  let restoring = false
  let restored = false
  let asker = false
  let crossed
  let started = false
  const unseen = []
  let drawnAt
  let touched = false

  function mount() {
    // A map with no room to draw in must never be drawn: at zero size its strokes never finish.
    if (scene && !(stage.clientWidth && stage.clientHeight)) return
    scene?.destroy()
    stage.replaceChildren()
    stage.removeAttribute('data-installed')
    stage.removeAttribute('style')
    stage.className = sketchbook.cls
    scene = sketchbook.mount(stage)
    drawnAt = { w: stage.clientWidth, h: stage.clientHeight }
    if (installed) setInstalled(true)
  }

  // Once calls have been drawn, a resize (going fullscreen mid-talk) must not rebuild the map and
  // lose them. The map keeps the size it was drawn at and is scaled to fit instead.
  const DOCK = 170
  function fit() {
    const beside = document.body.classList.contains('beside-claude') ? 446 : 0
    if (!touched && !beside) {
      // Nothing drawn yet, so a new size gets a fresh map. Stepping between stops is not a new size.
      const same = !stage.hasAttribute('style') && innerWidth === drawnAt.w && innerHeight - DOCK === drawnAt.h
      return same ? undefined : mount()
    }
    const room = innerWidth - beside
    const tall = innerHeight - DOCK
    const scale = Math.min(room / drawnAt.w, tall / drawnAt.h)
    const x = (room - drawnAt.w * scale) / 2
    const y = (tall - drawnAt.h * scale) / 2
    Object.assign(stage.style, {
      inset: 'auto', left: '0', top: '0', width: drawnAt.w + 'px', height: drawnAt.h + 'px',
      transformOrigin: '0 0', transform: `translate(${x}px, ${y}px) scale(${scale})`,
    })
  }

  // Every call, live or example, goes to the map and the log together.
  function show(event) {
    // The two servers are two servers. A call to the plain one is all levels 1 and 2 ever see, and a
    // call to the instrumented one belongs to level 3 alone.
    if (event.channel !== 'instrumented') return showPlain(event)
    seen.instrumented.push(event)
    feed.add(event)
    if (restoring) return
    // The built-in example is a single script standing in for both runs, so its calls are also shown
    // as the plain server would have recorded them. get_more_tools does not exist on that server.
    if (event.example && event.tool !== 'get_more_tools') {
      const token = event.user && `${event.user.toLowerCase().replace(' ', '.')}@example.com`
      showPlain({ tool: event.tool, args: event.args, error: event.error, at: event.at, durationMs: event.durationMs, channel: 'raw', token, run: event.run })
    }
    if (installed) draw(event)
    else held.push(event)
  }

  function showPlain(event) {
    seen.raw.push(event)
    feed.add(event)
    if (restoring) return
    lastCall = performance.now()
    touched = true
    if (level === 2) heard(event)
    if (level === 1) unseen.push(event)
    else scene.onEvent(event)
  }

  function draw(event) {
    if (event.session !== undefined) {
      event.color = colorOf(event.session)
      // The figure carries its customer's initials when the server knows who called, a letter otherwise.
      event.slot = [...sessionColors.keys()].indexOf(event.session)
      event.badge = event.user ? initials(event.user) : String.fromCharCode(65 + (event.slot % 26))
    }
    lastCall = performance.now()
    touched = true
    scene.onEvent(event)
  }

  let lastCall = -Infinity
  const initials = (name) => name.split(' ').map((part) => part[0]).join('').slice(0, 2)

  function onCall(call) {
    if (call.run && call.session) runSessions.set(call.run, call.session)
    show({
      tool: call.tool,
      channel: call.channel,
      session: call.session,
      client: call.client,
      model: call.model,
      why: call.errorMessage,
      run: call.run,
      user: call.user,
      // The plain server has no analytics, but it does know which signed-in customer's token called.
      token: lastRuns.find((run) => String(run.id) === call.run)?.customer?.email,
      intent: call.intent,
      args: call.args,
      at: call.at,
      durationMs: call.durationMs,
      error: call.isError,
      missing: call.tool === 'get_more_tools' ? call.intent || 'something this store cannot do yet' : undefined,
    })
  }

  // The same page runs two ways. Served by the demo server it is live: real agents run and the state
  // comes from the server. Anywhere else there is no /state to answer, so it shows one saved snapshot
  // of a real session, and nothing can be asked or started over.
  let live
  let saved
  async function readState() {
    live ??= (async () => {
      try {
        const response = await fetch('/state', { signal: AbortSignal.timeout(1500) })
        if (!response.ok || !(response.headers.get('content-type') ?? '').includes('json')) return false
        return Array.isArray((await response.json()).runs)
      } catch {
        return false
      }
    })().then((answered) => {
      // The page starts out marked as saved, so nothing that needs the server shows before it is known to be there.
      document.body.toggleAttribute('data-static', !answered)
      return answered
    })
    if (await live) return (await fetch('/state')).json()
    saved ??= fetch('state.json').then((response) => response.json())
    return saved
  }

  async function poll(seen) {
    try {
      const { toolCalls, runs } = await readState()
      serverRuns = runs
      showRuns(withExample())
      const latest = toolCalls[0]?.seq ?? 0
      if (!restored) {
        // A session that was already run is taken in whole on load, with no ceremony: its calls go on
        // record, and the level that is showing then tells them as it would have.
        restored = true
        const kept = new Set(runs.map((run) => String(run.id)))
        restoring = true
        toolCalls.filter((call) => kept.has(call.run)).reverse().forEach(onCall)
        restoring = false
        seen = latest
        if (current?.level && !clientSide) retell(current.level)
        playIfDue()
      }
      // A restarted server counts from zero again, so start over rather than wait to catch up.
      if (seen === undefined || latest < seen) seen = latest
      toolCalls.filter((call) => call.seq > seen).reverse().forEach(onCall)
      seen = latest
    } catch {
      // The server is restarting or the network dropped; keep the map up and try again.
    }
    if (await live) setTimeout(() => poll(seen), 300)
  }

  const promptsPanel = document.getElementById('prompts')
  const promptsToggle = document.querySelector('.prompts-toggle')

  // Sends a prompt to a real Claude agent on this laptop, pointed at whichever server the current view
  // stands for. Its tool calls come back through the normal feed, so nothing on the map is simulated.
  async function post(prompt, channel) {
    const response = await fetch('/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt, channel }),
    })
    const result = await response.json()
    if (!response.ok) throw new Error(result.error)
    return result
  }

  // A customer's request goes to both servers at once, as two separate agents: one talks to the plain
  // server and one to the server with MCP Analytics. Each level of the talk shows its own server's run.
  async function sendCustomer(prompt) {
    await Promise.all([post(prompt, 'raw'), post(prompt, 'instrumented')])
    detailRun = undefined
  }

  async function run(prompt, state, keepOpen, channel) {
    state.textContent = 'Sent'
    if (!keepOpen) togglePrompts()
    try {
      if (channel === 'developer') detailRun = (await post(prompt, channel)).id
      else await sendCustomer(prompt)
      setClaude({ hidden: false, min: false })
    } catch (error) {
      promptsError.textContent = error.message
      promptsError.hidden = false
      if (promptsPanel.hidden) togglePrompts()
    } finally {
      state.textContent = state.classList.contains('both') ? 'Run all' : 'Run'
    }
  }

  const claude = document.querySelector('.claude')
  const claudeList = claude.querySelector('ol')
  const claudeMin = claude.querySelector('.min')
  const runSessions = new Map()
  let shownRuns = ''
  let detailRun
  let lastRuns = []
  let agentBusy = false

  // Open, the panel takes the right edge and the map is scaled to sit beside it. Minimised, it is a
  // small tab and the map has the whole screen again.
  function setClaude({ hidden = claude.hidden, min = claude.hasAttribute('data-min') }) {
    claude.hidden = hidden
    claude.toggleAttribute('data-min', min)
    claudeMin.textContent = min ? '+' : '–'
    claudeMin.setAttribute('aria-expanded', String(!min))
    claudeMin.setAttribute('aria-label', min ? 'Show customers' : 'Minimise customers')
    document.body.classList.toggle('beside-claude', !hidden && !min && onMap)
    fit()
  }
  claudeMin.addEventListener('click', () => setClaude({ min: !claude.hasAttribute('data-min') }))

  const closeRuns = (which) =>
    fetch('/run/close', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(which) })

  const MARKS = { calling: '⊙', ok: '✓', error: '✕' }
  const STATUS = { running: 'working', done: 'ready', failed: 'failed' }
  const node = (tag, cls, value) => {
    const made = el(tag, cls)
    if (value !== undefined) made.textContent = value
    return made
  }

  function whoRow(run) {
    const session = runSessions.get(String(run.id))
    const row = node('div', 'who')
    if (session && installed) row.style.setProperty('--session', `rgb(${colorOf(session)})`)
    const developer = run.channel === 'developer'
    const name = run.customer?.name ?? `Customer ${run.id}`
    const num = node('span', developer ? 'num you' : 'num', developer ? 'you' : initials(name))
    num.setAttribute('aria-label', developer ? 'You, the developer' : name)
    const status = node('span', 'status', STATUS[run.status])
    status.dataset.status = run.status
    const words = node('div')
    words.append(node('p', 'name', developer ? 'You, the developer' : name), node('p', 'said', run.prompt))
    row.append(num, words, status)
    return row
  }

  // The list: one row per customer with what they asked, whether their agent is still working, and
  // just the store tools it has called. Picking a row opens that customer's whole conversation.
  function customerRow(run) {
    const li = node('li', 'customer')
    const pick = node('button', 'pick')
    pick.type = 'button'
    pick.setAttribute('aria-label', `Open customer ${run.id}`)
    const calls = node('span', 'calls')
    for (const item of run.items) {
      if (item.type !== 'tool' || unknownYet(item)) continue
      const call = node('span', 'call', `${MARKS[item.state]} ${item.name}`)
      call.dataset.state = item.state
      calls.append(call)
    }
    pick.append(whoRow(run), calls)
    pick.addEventListener('click', () => {
      detailRun = run.id
      showRuns()
    })
    const shut = node('button', 'shut', '×')
    shut.type = 'button'
    shut.setAttribute('aria-label', `Close customer ${run.id}`)
    shut.addEventListener('click', () => closeRuns({ id: run.id }))
    li.append(pick, shut)
    return li
  }

  // What the customer's agent chose to send. The arguments the SDK adds for the server's benefit are
  // left out here: they belong to the analytics view, not to the customer's conversation.
  const sent = ({ context, conversation_id, llm_model, ...args } = {}) => args

  // The built-in example is one conversation standing in for two. get_more_tools is a tool the SDK
  // adds, so before level 3 the example must not show the agent calling it.
  const unknownYet = (item) => item.type === 'tool' && item.name === 'get_more_tools' && (level < 3 || clientSide)

  function conversation(run) {
    const list = node('ol', 'talk')
    // While a level is retelling this customer's errand, their actions are marked done, now or later.
    const following = cursor?.run === String(run.id) ? cursor : undefined
    let action = 0
    for (const item of run.items) {
      if (unknownYet(item)) continue
      if (item.type === 'text') {
        const [prose, chart] = charted(item.text)
        if (chart) list.chart = chart
        const say = node('li', 'say')
        say.append(rich(prose))
        if (following) say.dataset.later = ''
        list.append(say)
        continue
      }
      // The developer's agent reaches PostHog through one tool that takes a command. The queries are
      // what matter; looking up how to use them is plumbing.
      const asked = run.channel === 'developer' && String(item.input?.command ?? '').split(' ').filter((word) => word !== '--json')
      if (asked && asked[0] !== 'call') continue
      const li = node('li', 'use')
      if (following && action === following.index) li.dataset.now = ''
      if (following && action > following.index) li.dataset.later = ''
      action += 1
      li.dataset.state = item.state
      li.append(
        node('span', 'mark', MARKS[item.state]),
        node('span', 'name', asked ? asked[1] : item.name),
        node('span', 'args', asked ? asked.slice(2).join(' ') : JSON.stringify(sent(item.input)))
      )
      if (item.state === 'error' && item.output) li.append(node('span', 'back', item.output))
      list.append(li)
    }
    return list
  }

  // An answer may end with the numbers behind it, as a block the page draws and does not print.
  function charted(text) {
    const block = text.match(/```chart\s*([\s\S]*?)```/)
    const prose = text.replace(/```chart[\s\S]*?(```|$)/, '').trim()
    try {
      const data = block && JSON.parse(block[1])
      return [prose, data?.bars?.length ? data : undefined]
    } catch {
      return [prose, undefined]
    }
  }

  // Plain paragraphs, short lists and bold, built as elements so nothing in an answer is ever run.
  function rich(text) {
    const box = document.createDocumentFragment()
    let list
    for (const raw of text.split('\n')) {
      const line = raw.trim()
      if (!line) {
        list = undefined
        continue
      }
      const bullet = /^[-•]\s+/.test(line)
      let target
      if (bullet) {
        list ??= box.appendChild(node('ul'))
        target = list.appendChild(node('li'))
      } else {
        list = undefined
        target = box.appendChild(node('p', /^what i would do next/i.test(line) ? 'next' : ''))
      }
      line
        .replace(/^[-•]\s+/, '')
        .split('**')
        .forEach((part, i) => part && target.append(i % 2 ? node('strong', '', part) : part.replace(/`/g, '')))
    }
    return box
  }

  // One measure, one colour, and the number on every bar: there is nothing here to need a legend.
  function drawChart({ title, bars, unit = '' }) {
    const figure = node('figure', 'chart')
    const top = Math.max(...bars.map((bar) => Number(bar.value) || 0), 1)
    const rows = node('ol')
    for (const bar of bars.slice(0, 5)) {
      const row = node('li')
      const fill = node('i')
      fill.style.width = `${Math.max(2, ((Number(bar.value) || 0) / top) * 100)}%`
      const track = node('span', 'track')
      track.append(fill)
      row.append(node('span', 'label', String(bar.label)), track, node('span', 'value', String(bar.value) + unit))
      rows.append(row)
    }
    figure.append(node('figcaption', '', String(title ?? '')), rows)
    return figure
  }

  function customerDetail(run) {
    const li = node('li', 'detail')
    const back = node('button', 'back-to-list', '← All customers')
    back.type = 'button'
    back.addEventListener('click', () => {
      detailRun = 'list'
      showRuns()
    })
    const talk = conversation(run)
    li.append(back, whoRow(run), talk)
    if (talk.chart) {
      li.classList.add('charted')
      li.append(drawChart(talk.chart))
    }
    return li
  }

  // Customers of the server this view stands for. Each is its own Claude session with its own cart.
  // Once analytics has tied a customer to a session, its number takes that session's colour, the
  // same as its figure on the map.
  function showRuns(all = lastRuns) {
    lastRuns = all
    agentBusy = all.some((run) => run.status === 'running')
    // The developer's own questions sit with the instrumented server, since that is what they read.
    // Each customer has two conversations, one with each server. Up to level 2 the one on screen is
    // with the plain server; at level 3 it is the one with the instrumented server.
    const side = level === 3 && !clientSide ? 'instrumented' : 'raw'
    // On the developer's own stop the only conversation is theirs, with PostHog.
    const runs = all.filter((run) => (asker ? run.channel === 'developer' : run.channel === 'developer' ? installed : run.channel === 'both' || run.channel === side))
    const customers = runs.filter((run) => run.channel !== 'developer').length
    // The latest conversation is open unless the list was asked for.
    const open = runs.find((run) => run.id === detailRun) ?? (detailRun === 'list' ? undefined : runs.findLast((run) => asker || run.channel !== 'developer'))
    const key = JSON.stringify([runs, installed, open?.id, clientSide, asker, level, [...runSessions]])
    if (key === shownRuns) return
    shownRuns = key
    composer.querySelector('button').disabled = composerInput.disabled = agentBusy
    if (!runs.length && !clientSide) return setClaude({ hidden: true })
    // Sessions that were already running when the page loaded start as a tab, so they are not lost.
    if (claude.hidden) setClaude({ hidden: false, min: !clientSide })
    const whose = !open ? 'Customers' : open.channel === 'developer' ? 'Your side' : `${(open.customer?.name ?? 'The customer').split(' ')[0]}’s side`
    claude.querySelector('h2').textContent = asker ? 'Your side' : clientSide && !open ? 'Priya’s side' : whose
    claude.querySelector('.server').textContent =
      asker || open?.channel === 'developer' ? 'You, asking PostHog about your server, from your own agent.'
      : open || clientSide ? 'Her agent, on her machine. Your server never sees this conversation.'
      : `${customers === 1 ? '1 customer' : customers + ' customers'}. Your server never sees this side.`
    claude.toggleAttribute('data-detail', Boolean(open))
    const empty = node('li', 'empty', 'Nothing asked yet.')
    claudeList.replaceChildren(...(open ? [customerDetail(open)] : runs.length ? runs.map(customerRow) : [empty]))
    const talk = claudeList.querySelector('.talk')
    const now = talk?.querySelector('[data-now]')
    if (now) talk.scrollTop = now.offsetTop - talk.offsetTop - talk.clientHeight / 3
    else if (talk) talk.scrollTop = talk.scrollHeight
  }
  // Starting over closes every conversation, forgets their calls, and clears the screen.
  claude.querySelector('.clear').addEventListener('click', async () => {
    await closeRuns({ all: true })
    serverRuns = []
    detailRun = undefined
    startOver()
    composerInput.value = asker ? (askPrompts[0] ?? '') : storyPrompt
    shownRuns = ''
    showRuns(withExample())
  })

  // The customer's own words, typed where a customer would type them.
  const composer = claude.querySelector('.composer')
  const composerInput = composer.querySelector('input')
  composer.addEventListener('submit', async (e) => {
    e.preventDefault()
    const prompt = composerInput.value.trim()
    if (!prompt) return
    composerInput.value = ''
    try {
      if (asker) detailRun = (await post(prompt, 'developer')).id
      else await sendCustomer(prompt)
    } catch (error) {
      composerInput.value = error.message
    }
  })

  // With no agent on hand, the built-in example fills the same conversation the customer would have.
  let serverRuns = []
  let exampleRun
  const withExample = () => (exampleRun ? [...serverRuns, exampleRun] : serverRuns)
  function exampleSaid(event, done, total) {
    exampleRun ??= { id: 'example', channel: 'both', prompt: storyPrompt, customer: { name: 'Priya Raman' }, status: 'running', items: [] }
    exampleRun.items.push({ type: 'tool', id: String(done), name: event.tool, input: event.args, state: event.error ? 'error' : 'ok', output: event.error })
    if (done === total) {
      exampleRun.status = 'done'
      exampleRun.items.push({
        type: 'text',
        text: 'I couldn’t place the order: the store doesn’t ship to Brazil. The Hedgehog Hoodie is also sold out in medium, so I put a large in the cart. Nothing was charged.',
      })
    }
    detailRun = undefined
    showRuns(withExample())
  }
  let storyPrompt = ''
  let askPrompts = []

  function promptButton(text, channel) {
    const button = el('button', 'prompt')
    button.type = 'button'
    const body = el('span')
    body.textContent = text
    const state = el('span', 'state')
    state.textContent = 'Run'
    button.append(body, state)
    button.addEventListener('click', () => run(text, state, false, channel))
    return button
  }

  const promptsError = el('p', 'prompts-error')
  promptsError.hidden = true
  promptsError.setAttribute('role', 'alert')

  async function loadPrompts() {
    const target = el('p', 'prompts-target')
    const form = el('form', 'prompts-form')
    const label = el('label')
    label.textContent = 'Prompt from the room'
    label.htmlFor = 'own-prompt'
    const input = el('input')
    input.id = 'own-prompt'
    input.autocomplete = 'off'
    const send = el('button')
    send.type = 'submit'
    send.textContent = 'Run'
    form.append(label, input, send)
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      if (!input.value.trim()) return
      run(input.value.trim(), send, false, asking ? 'developer' : undefined)
      input.value = ''
    })
    promptsPanel.append(target, form, promptsError)
    setInterval(() => {
      target.textContent = asking
        ? 'Asks PostHog about this server'
        : 'Sends a real customer to both of your servers'
    }, 300)

    const { prompts, developerPrompts, products } = await readState()
    for (const product of products) prices.set(product.id, product.priceUsd)
    storyPrompt = prompts[0][1]
    askPrompts = developerPrompts.map(([, text]) => text)
    composerInput.value = asker ? askPrompts[0] : storyPrompt
    composer.querySelector('.asks').replaceChildren(
      ...askPrompts.map((text) => {
        const pick = node('button', '', text)
        pick.type = 'button'
        pick.addEventListener('click', () => {
          composerInput.value = text
          composer.requestSubmit()
        })
        return pick
      })
    )
    const groups = new Map()
    for (const [tag, text] of prompts) groups.set(tag, [...(groups.get(tag) || []), text])
    for (const [tag, texts] of groups) {
      const section = el('section')
      const heading = el('h3')
      heading.textContent = tag
      // Two customers at once is the point of a pair: their calls land mixed together in the log.
      const both = el('button', 'both')
      both.type = 'button'
      both.textContent = 'Run all'
      both.hidden = texts.length < 2
      both.addEventListener('click', () => {
        togglePrompts()
        texts.forEach((text) => run(text, both, true))
      })
      heading.append(both)
      section.append(heading, ...texts.map((text) => promptButton(text)))
      promptsPanel.append(section)
    }
    // The builder's own question: a Claude that reads MCP Analytics through the PostHog MCP.
    const ask = el('section', 'developer')
    const title = el('h3')
    title.textContent = 'ask as the developer'
    ask.append(title, ...developerPrompts.map(([, text]) => promptButton(text, 'developer')))
    promptsPanel.append(ask)
  }
  // On the developer stop the bar asks PostHog about the server; everywhere else it sends a customer.
  let asking = false
  function togglePrompts() {
    promptsPanel.hidden = !promptsPanel.hidden
    promptsToggle.setAttribute('aria-expanded', String(!promptsPanel.hidden))
    if (!promptsPanel.hidden) promptsError.hidden = true
  }
  promptsToggle.addEventListener('click', togglePrompts)
  loadPrompts()

  mount()
  setLevel(1)
  let current
  const cancels = []
  function playIfDue() {
    // The example is a stand-in for a real run, so it stays out of the way once there is one, and it
    // waits until the page knows whether a saved session exists.
    if (!restored || serverRuns.some((run) => run.channel !== 'developer')) return
    if (!current?.example || !examples || played[current.example]) return
    played[current.example] = true
    let latest
    cancels.push(
      playExample(
        (event) => show((latest = { ...event, run: 'example' })),
        (done, total) => {
          example = { done, total }
          if (done) exampleSaid(latest, done, total)
        }
      )
    )
  }

  // Examples off means only real calls reach the screen. The choice lives in the URL so R keeps it.
  const examplesToggle = document.querySelector('.examples-toggle')
  function setExamples(on) {
    examples = on
    examplesToggle.setAttribute('aria-pressed', String(on))
    examplesToggle.querySelector('.state').textContent = on ? 'on' : 'off'
    const url = new URL(location)
    if (on) url.searchParams.delete('examples')
    else url.searchParams.set('examples', 'off')
    history.replaceState(null, '', url)
    startOver()
  }
  // The screen starts clean: an empty log, no session cards, and a freshly drawn map, so what is
  // showing afterwards is unambiguous.
  function startOver() {
    clearTimeout(telling)
    abandon = undefined
    cursor = undefined
    cancels.splice(0).forEach((cancel) => cancel())
    example = undefined
    exampleRun = undefined
    for (const key of Object.keys(played)) delete played[key]
    held.length = unseen.length = seen.raw.length = seen.instrumented.length = 0
    told.clear()
    sessionColors.clear()
    feed.reset()
    touched = false
    mount()
    playIfDue()
  }
  examplesToggle.addEventListener('click', () => setExamples(!examples))
  if (!examples) {
    examplesToggle.setAttribute('aria-pressed', 'false')
    examplesToggle.querySelector('.state').textContent = 'off'
  }

  const arrive = (stop, step, paint) => {
    if (!stop.level) abandon?.()
    document.querySelector('.legend').toggleAttribute('data-compact', stop.level > 1)
    paint()
    feed.setReveal(stop.steps && stop.level ? step + 1 : 4)
    promptsPanel.hidden = true
    promptsToggle.setAttribute('aria-expanded', 'false')
    const wasClient = clientSide
    // Two stops are a conversation on its own, full screen: the customer's with her agent, and the
    // developer's with PostHog.
    clientSide = Boolean(stop.side)
    asker = stop.side === 'developer'
    document.body.toggleAttribute('data-client', clientSide)
    document.body.toggleAttribute('data-asker', asker)
    if (askPrompts.length) composerInput.value = asker ? askPrompts[0] : storyPrompt
    onMap = stop.kind === 'caption' && !clientSide
    // The customer's side is one open conversation. Crossing to the server keeps it open, docked.
    if (clientSide) setClaude({ hidden: false, min: false })
    else if (wasClient) setClaude({ hidden: !lastRuns.length, min: false })
    else setClaude({})
    // A stop only picks which view is showing. Nothing drawn so far is thrown away, and each example
    // plays once, so stepping back and forth through the talk keeps everything. R starts over.
    if (stop.level) setLevel(stop.level, stop !== current)
    current = stop
    shownRuns = ''
    showRuns()
    playIfDue()
  }
  // Crossing between the customer's side and the server's is the one move in the talk that is animated:
  // the server's side fades in as the conversation settles at the edge.
  const story = createStory(document.querySelector('.story'), (stop, step, paint) => {
    const crossing = Boolean(stop.side) !== clientSide && started
    started = true
    arrive(stop, step, paint)
    if (!crossing) return
    document.body.dataset.crossing = stop.side ? 'client' : 'server'
    clearTimeout(crossed)
    crossed = setTimeout(() => delete document.body.dataset.crossing, 600)
  })

  // Presenter cue, bottom right: busy while calls are still arriving or walkers are still moving.
  setInterval(() => {
    if (!onMap && !clientSide) return story.setCue('', false)
    if (agentBusy) return story.setCue('Claude is working', true)
    if (cursor) return story.setCue('retelling', true)
    if (example && example.done < example.total) return story.setCue(`example ${example.done}/${example.total}`, true)
    if (scene.busy() || performance.now() - lastCall < 2500) return story.setCue('still moving', true)
    story.setCue('ready →', false)
  }, 300)
  if (scripted) startStream((event) => show({ ...event, channel: 'instrumented' }))
  else poll()

  let resizing
  window.addEventListener('resize', () => {
    clearTimeout(resizing)
    resizing = setTimeout(fit, 200)
  })
  console.log('%cDeck shortcuts', 'font-weight: bold; font-size: 14px')
  console.table({
    'Right, Space, Page Down': 'Next stop, or the next press on a stop with steps',
    'Left, Page Up': 'Previous stop',
    F: 'Full screen (Esc leaves it)',
    S: 'Speaker notes in their own window',
    N: 'Speaker notes on the deck, for rehearsing',
    D: 'Dark or light',
    M: 'Sound off or on',
    E: 'Example calls off or on',
    C: 'Fold or unfold the customer conversation',
    P: 'Prepared prompts bar',
    R: 'Reload',
  })

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.('input, textarea')) return
    if (e.key === 'p' || e.key === 'P') togglePrompts()
    if (e.key === 'r' || e.key === 'R') location.reload()
    if (e.key === 'm' || e.key === 'M') story.setCue(sound.toggle() ? 'sound off' : 'sound on', false)
    // Full screen takes the address bar and tabs off the projector. Esc leaves it.
    if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()
    if (e.key === 'e' || e.key === 'E') setExamples(!examples)
    if (e.key === 'd' || e.key === 'D') {
      const dark = document.documentElement.dataset.theme !== 'dark'
      dark ? (document.documentElement.dataset.theme = 'dark') : delete document.documentElement.dataset.theme
      try {
        localStorage.setItem('merch-theme', dark ? 'dark' : 'light')
      } catch {}
    }
    if ((e.key === 'c' || e.key === 'C') && !claude.hidden) claudeMin.click()
  })
</script>
</body>
</html>
