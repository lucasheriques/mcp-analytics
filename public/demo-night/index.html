<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Merch Store Map</title>
<link rel="icon" type="image/svg+xml" href="art/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // Before anything paints, so a reload in dark mode does not flash light.
  try {
    const asked = new URLSearchParams(location.search).get('theme')
    if ((asked ?? localStorage.getItem('merch-theme')) === 'dark') document.documentElement.dataset.theme = 'dark'
  } catch {}
</script>
<style>
  @font-face { font-family: "RoundHog"; font-weight: 500; src: url("fonts/RoundHog-Medium.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "RoundHog"; font-weight: 600; src: url("fonts/RoundHog-SemiBold.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "RoundHog"; font-weight: 500; font-style: italic; src: url("fonts/RoundHog-Medium-Italic.woff2") format("woff2"); font-display: swap; }

  :root {
    --brand: #f54e00;
    --font: "RoundHog", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --focus-in: cubic-bezier(0.45, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  /* Dark mode turns the whole page over once, keeping every hue, and turns pictures back so drawings, the meme and the QR code stay as they were made. */
  html[data-theme="dark"] { filter: invert(1) hue-rotate(180deg) url(#dark-range); }
  html[data-theme="dark"] :is(img:not(.story-logo), .terminal) { filter: url(#dark-range-undo) hue-rotate(180deg) invert(1); }
  .speaker { position: fixed; left: 20px; bottom: 16px; z-index: 12; width: min(480px, 42vw); max-height: 70vh; overflow: auto; padding: 14px 16px; border: 2px solid #151b2e; border-radius: 12px; box-shadow: 4px 4px 0 #151b2e; background: #fffdf7; color: #151b2e; font: 500 15px/1.4 var(--font); }
  .speaker[hidden] { display: none; }
  .speaker p + p { margin-top: 8px; }
  .speaker .aside { font-size: 13.5px; color: rgba(21, 27, 46, 0.7); }
  .speaker b { font: 700 11px/1 var(--mono); letter-spacing: 0.04em; color: var(--brand); }
  html, body { height: 100%; overflow: hidden; background: #efe6d2; }
  body { font-family: var(--font); font-weight: 500; -webkit-font-smoothing: antialiased; }

  /* The map stops short of the bottom edge, so the log and the board sit on bare paper and not over its tools. */
  #stage { position: fixed; inset: 0 0 170px; overflow: hidden; }
  #stage.dark { --ink: #f4f1ea; --dim: rgba(244, 241, 234, 0.72); --scrim: rgba(16, 19, 27, 0.74); --edge: #2c303a; --warn: #ff9d7a; }
  #stage.light { --ink: #23261f; --dim: rgba(35, 38, 31, 0.74); --scrim: rgba(250, 246, 236, 0.9); --edge: rgba(0, 0, 0, 0.1); --warn: #b23a12; }

  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Before install the painting is out of focus; installing brings it in once, slowly, because it is the moment of the demo. */
  .base { filter: blur(7px) saturate(0.75); transition: filter 2400ms var(--focus-in); }
  #stage[data-installed] .base { filter: none; }
  #stage.drawn .base { filter: none; transition: none; }
  #stage.drawn .name {
    font: italic 500 16px/1 var(--font); padding: 5px 9px; border-radius: 3px;
    background: rgba(250, 244, 230, 0.94); border: 1px solid rgba(74, 70, 80, 0.3);
  }
  #stage.drawn .name.faint { background: none; border-color: transparent; color: rgba(74, 70, 80, 0.75); }
  #stage.drawn .fail { font-style: normal; }
  #stage.drawn .tag, #stage.drawn .list { border-radius: 4px; border: 1px solid rgba(74, 70, 80, 0.3); background: rgba(250, 244, 230, 0.95); }

  .notes { position: absolute; inset: 0; color: var(--ink); pointer-events: none; }
  /* Each view keeps its own marks and labels; only the one in force is shown. */
  #stage:not([data-installed]) :is(.over, .notes-after) { visibility: hidden; }
  #stage[data-installed] :is(.before, .notes-before) { visibility: hidden; }
  .pin { position: absolute; }
  .pin.below { transform: translate(-50%, 0); }
  .pin.above { transform: translate(0, -100%); }
  .pin.below-left { transform: translate(-100%, 0); }
  .pin.beside { transform: translate(0, -50%); }
  .pin.board-pin { transform: translate(0, -100%); }

  .name {
    display: block; white-space: nowrap; font: 500 14px/1 var(--mono);
    padding: 5px 8px; border-radius: 6px; background: var(--scrim); color: var(--ink);
  }
  .fail { color: var(--warn); font-family: var(--font); font-weight: 600; }

  .tag {
    position: absolute; left: 0; top: 0; max-width: 27ch; text-align: center; text-wrap: balance;
    font: italic 500 17px/1.25 var(--font); padding: 7px 11px; border-radius: 9px;
    background: var(--scrim); color: var(--ink);
    opacity: 0; transition: opacity 180ms ease-out; will-change: transform;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .tag[data-on] { opacity: 1; }

  .list { min-width: 230px; max-width: 320px; padding: 12px 14px; border-radius: 10px; background: var(--scrim); border: 1px solid var(--edge); }
  .list h3 { font: 600 12px/1 var(--font); letter-spacing: 0.09em; text-transform: uppercase; color: var(--dim); margin-bottom: 9px; }
  .list ul { list-style: none; padding: 0; display: grid; gap: 6px; }
  .list li { display: flex; gap: 14px; justify-content: space-between; align-items: baseline; font-size: 17px; line-height: 1.25; }
  .list li span { text-wrap: pretty; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .list li b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--dim); }
  .list li.enter { animation: row-in 220ms cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes row-in { from { opacity: 0; transform: translateY(6px); } }

  .board { display: grid; gap: 8px; width: min(340px, 26vw); }
  .board .list { max-width: none; }

  .chip {
    position: fixed; top: 24px; left: 24px; z-index: 10; height: 44px; padding: 0 14px;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    border: 1px solid #2c303a; border-radius: 10px; background: rgba(14, 16, 22, 0.78);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, 0.62); font: 500 15px/1 var(--mono);
    transition: color 150ms ease-out, border-color 150ms ease-out, scale 150ms ease-out;
  }
  button.chip:active { scale: 0.97; }
  .chip:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.5); outline-offset: 2px; }
  .chip kbd { font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.1); }
  @media (hover: hover) and (pointer: fine) { button.chip:hover { color: #fff; } }

  /* The talk: cards and captions laid over the map, in the style of the demo night deck. */
  .story { --navy: #151b2e; --peach: #ffd9a8; position: fixed; inset: 0; z-index: 5; color: var(--navy); pointer-events: none; }
  .story h1 { font: 700 clamp(34px, 4.6vw, 76px)/1.08 "Iowan Old Style", "Charter", "Georgia", serif; letter-spacing: -0.01em; text-wrap: balance; }
  .story mark { background: var(--peach); color: inherit; padding: 0 0.12em; border-radius: 4px; }
  .story .kicker { font: 600 clamp(12px, 1vw, 15px)/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(21, 27, 46, 0.68); }
  .story .sub { font: 500 clamp(18px, 1.7vw, 27px)/1.35 var(--font); max-width: 34em; text-wrap: pretty; color: rgba(21, 27, 46, 0.82); }
  .story .foot { font: 600 clamp(16px, 1.4vw, 22px)/1.35 var(--font); max-width: 40em; }
  .story-body { display: grid; gap: clamp(14px, 1.8vw, 28px); align-content: center; justify-items: start; }

  .story-card {
    position: absolute; inset: 0; pointer-events: auto; background: #f8f3e7;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4vw;
    padding: 6vh max(6vw, 32px) 12vh;
  }
  .story-art { width: min(30vw, 46vh); height: auto; }
  .story-picture { width: auto; max-width: min(40vw, 640px); max-height: 78vh; border: 2px solid var(--navy); border-radius: 12px; box-shadow: 4px 4px 0 var(--navy); }
  .story-picture[hidden] { display: none; }
  /* With the picture in place it tells the four levels by itself, so the tiles step aside. */
  .story .with-picture .ladder { display: none; }
  .story-logo { position: absolute; left: max(6vw, 32px); bottom: 5vh; width: clamp(110px, 9vw, 150px); height: auto; }

  .story-caption {
    position: absolute; left: 298px; right: 172px; top: 24px; width: fit-content; max-width: 700px;
    padding: 14px 20px; border-radius: 6px; background: rgba(250, 246, 236, 0.95); border: 1px solid rgba(74, 70, 80, 0.3);
  }
  .story-caption .story-body { gap: 8px; }
  .story-caption h1 { font-size: clamp(20px, 2vw, 32px); text-wrap: pretty; }

  .story .tiles { list-style: none; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: clamp(12px, 1.4vw, 22px); width: min(100%, 980px); counter-reset: tile; }
  .story .tiles li {
    display: grid; gap: 6px; align-content: start; padding: clamp(14px, 1.4vw, 22px); border: 2px solid var(--navy); border-radius: 12px;
    box-shadow: 4px 4px 0 var(--navy); background: #a9daf8;
  }
  .story .tiles li:nth-child(2) { background: #ffd3a6; }
  .story .tiles li:nth-child(3) { background: #b4efdc; }
  .story .tiles strong { font: 700 clamp(17px, 1.6vw, 25px)/1.2 "Iowan Old Style", "Charter", "Georgia", serif; }
  .story .tiles span { font: 500 clamp(14px, 1.1vw, 18px)/1.3 var(--font); }

  .story .stats { list-style: none; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: clamp(12px, 1.4vw, 22px); width: 100%; }
  .story .stats li { display: grid; gap: 8px; align-content: start; padding: clamp(16px, 1.6vw, 26px); border: 2px solid var(--navy); border-radius: 12px; box-shadow: 4px 4px 0 var(--navy); background: #fffdf7; animation: row-in 280ms cubic-bezier(0.32, 0.72, 0, 1) backwards; }
  .story .stats strong { font: 700 clamp(26px, 2.8vw, 46px)/1 "Iowan Old Style", "Charter", "Georgia", serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .story .stats:has(li:nth-child(4)) strong { font-size: clamp(20px, 2.3vw, 40px); }
  .story .stats:has(li:nth-child(5)) strong { font-size: clamp(17px, 1.85vw, 32px); }
  .story .stats:has(li:nth-child(5)) li { padding: clamp(12px, 1.2vw, 20px); }
  .story .stats .pr { justify-self: start; margin-top: 4px; font: 500 clamp(11px, 0.95vw, 15px)/1.2 var(--mono); color: rgba(21, 27, 46, 0.7); text-decoration: underline; text-underline-offset: 3px; }
  .story .stats .pr:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .story .stats span { font: 500 clamp(15px, 1.25vw, 20px)/1.3 var(--font); color: rgba(21, 27, 46, 0.82); text-wrap: pretty; }
  .story .pic { display: flex; align-items: flex-end; gap: 6px; height: clamp(56px, 6vw, 92px); margin-bottom: 6px; }
  .story .pic i { flex: 0 1 clamp(18px, 1.9vw, 28px); min-width: 0; aspect-ratio: 1; border: 2px solid var(--navy); border-radius: 5px; }
  .story .pic[data-of="3"] i { flex-basis: clamp(30px, 3vw, 46px); border-radius: 50%; }
  .story .pic i.on { background: var(--brand); }
  .story .pic.line { display: block; position: relative; margin-right: 8px; }
  .story .pic.line svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .story .pic.line .area { fill: rgba(21, 27, 46, 0.08); }
  .story .pic.line .trace { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .story .pic.line .end { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; aspect-ratio: auto; flex: none; border: 2px solid #fffdf7; border-radius: 50%; background: var(--brand); }
  /* A card with steps shows one tile per press, so the room reads one number at a time. */
  .story[data-step="1"] .stepped li:nth-child(n + 2), .story[data-step="2"] .stepped li:nth-child(n + 3), .story[data-step="3"] .stepped li:nth-child(n + 4) { visibility: hidden; animation: none; }
  .story .qrs { display: flex; flex-wrap: wrap; align-items: stretch; gap: 18px; }
  .story .qr:not(:has(img)) { padding-left: 20px; }

  .story .quote { margin: 0; padding: clamp(14px, 1.6vw, 24px) clamp(18px, 2vw, 30px); border: 2px solid var(--navy); border-radius: 12px; box-shadow: 4px 4px 0 var(--navy); background: #fffdf7; font: italic 500 clamp(22px, 2.4vw, 38px)/1.3 var(--font); max-width: 26em; text-wrap: balance; }
  /* The three levels as steps that climb: each one is taller and sees more than the last. */
  .story .ladder { list-style: none; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: clamp(12px, 1.4vw, 22px); width: min(100%, 1040px); }
  .story .ladder li { display: grid; gap: 6px; align-content: start; padding: clamp(14px, 1.4vw, 22px); border: 2px solid var(--navy); border-radius: 12px; box-shadow: 4px 4px 0 var(--navy); background: #e9e4d6; min-height: clamp(120px, 12vw, 180px); }
  .story .ladder li:nth-child(2) { background: #a9daf8; min-height: clamp(150px, 15vw, 230px); }
  .story .ladder li:nth-child(3) { background: #ffd3a6; min-height: clamp(180px, 18vw, 280px); }
  .story .brain { width: clamp(44px, 4.4vw, 68px); margin-bottom: 2px; }
  .story .brain-2 { width: clamp(58px, 5.8vw, 90px); }
  .story .brain-3 { width: clamp(76px, 7.6vw, 118px); }
  .story .brain svg { display: block; width: 100%; height: auto; overflow: visible; }
  .story .brain .lobe { fill: #cfc8b8; stroke: var(--navy); stroke-width: 2.5; stroke-linejoin: round; }
  .story .brain .fold { fill: none; stroke: var(--navy); stroke-width: 2; stroke-linecap: round; }
  .story .brain .ray { stroke: var(--navy); stroke-width: 2.5; stroke-linecap: round; }
  .story .brain-2 .lobe { fill: #fffdf7; }
  .story .brain-3 .lobe { fill: #fffdf7; }
  .story .brain-3 .ray { stroke: var(--brand); stroke-width: 3; }
  .story .brain-3 svg { filter: drop-shadow(0 0 10px rgba(245, 78, 0, 0.45)); }
  .story .brain-4 { width: clamp(88px, 8.8vw, 136px); }
  .story .brain-4 .lobe { fill: #fffdf7; }
  .story .brain-4 .ray { stroke: var(--brand); stroke-width: 3; }
  .story .brain-4 svg { filter: drop-shadow(0 0 16px rgba(245, 78, 0, 0.7)); }
  .story .ladder li:nth-child(4) { background: #b4efdc; min-height: clamp(210px, 21vw, 330px); }
  .story .ladder .rung { font: 600 clamp(11px, 0.9vw, 14px)/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(21, 27, 46, 0.68); }
  .story .ladder strong { font: 700 clamp(18px, 1.8vw, 28px)/1.15 "Iowan Old Style", "Charter", "Georgia", serif; }
  .story .ladder li > span:last-child { font: 500 clamp(14px, 1.2vw, 19px)/1.3 var(--font); }

  .story .tiles .prs { display: flex; gap: 12px; margin-top: 4px; font: 500 clamp(11px, 0.95vw, 15px)/1.2 var(--mono); }
  .story .tiles .prs a { color: rgba(21, 27, 46, 0.75); text-underline-offset: 3px; }
  .story .tiles .prs a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .story .fixes { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .story .fixes li { display: grid; gap: 3px; padding: 10px 14px; border: 2px solid var(--navy); border-radius: 10px; background: #fffdf7; }
  .story .fixes strong { font: 600 clamp(13px, 1.1vw, 17px)/1.2 var(--mono); }
  .story .fixes span { font: 700 clamp(15px, 1.4vw, 22px)/1.1 "Iowan Old Style", "Charter", "Georgia", serif; font-variant-numeric: tabular-nums; }
  .story .fixes a { font: 500 clamp(11px, 0.9vw, 14px)/1.2 var(--mono); color: rgba(21, 27, 46, 0.7); text-underline-offset: 3px; }
  .story .fixes a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  .story .chips { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; max-width: 46em; }
  .story .chips li { padding: 8px 12px; border-radius: 8px; border: 2px solid var(--navy); background: #fffdf7; font: 500 clamp(14px, 1.3vw, 20px)/1 var(--mono); }

  .story .code { display: grid; gap: 10px; margin: 0; padding: clamp(16px, 1.8vw, 28px) clamp(18px, 2.2vw, 34px); border-radius: 12px; background: var(--navy); box-shadow: 4px 4px 0 var(--brand); }
  .story .code code { font: 500 clamp(22px, 2.9vw, 46px)/1.2 var(--mono); color: #fdf8ec; }
  .story .code code::before { content: "$ "; color: var(--brand); }
  .story .code code.alt { font-size: clamp(14px, 1.3vw, 20px); color: rgba(253, 248, 236, 0.62); }
  .story .code code.alt::before { content: "it adds  "; color: inherit; }

  .story .qr { display: flex; align-items: center; gap: 18px; padding: 14px 20px 14px 14px; border: 2px solid var(--navy); border-radius: 12px; box-shadow: 4px 4px 0 var(--navy); background: #fff; }
  .story .qr img { width: clamp(110px, 11vw, 170px); height: auto; display: block; }
  .story .qr .url { font: 600 clamp(16px, 1.5vw, 24px)/1.3 var(--mono); margin-top: 8px; }

  /* The map controls stay out of the way while a card is up. */
  body:has(.story[data-kind="card"]) .chip, body:has(.story[data-kind="card"]) .prompts { display: none; }

  .story-nav { position: fixed; right: 20px; bottom: 16px; z-index: 11; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(250, 246, 236, 0.92); font: 500 13px/1 var(--mono); color: rgba(21, 27, 46, 0.8); }
  .story-nav span { min-width: 6ch; white-space: nowrap; padding: 0 4px; text-align: center; font-variant-numeric: tabular-nums; }
  .story-nav button {
    width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 18px; cursor: pointer;
    transition: background-color 150ms ease-out;
  }
  .story-nav button:disabled { opacity: 0.3; cursor: default; }
  .story-nav button:focus-visible { outline: 2px solid var(--navy, #151b2e); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .story-nav button:not(:disabled):hover { background: rgba(21, 27, 46, 0.08); } }

  /* The map's key: what this land is, and what each mark on it means. */
  .legend { position: fixed; left: 24px; top: 24px; z-index: 6; width: 250px; padding: 12px 14px; border-radius: 4px; background: rgba(250, 246, 236, 0.95); border: 1px solid rgba(74, 70, 80, 0.3); color: #151b2e; }
  .legend h2 { font: 700 17px/1.2 "Iowan Old Style", "Charter", "Georgia", serif; }
  .legend p { font: 500 13px/1.35 var(--font); color: rgba(21, 27, 46, 0.75); margin: 4px 0 10px; }
  .legend ul { list-style: none; padding: 0; display: grid; gap: 6px; font: 500 14px/1.2 var(--font); }
  .legend li { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 8px; }
  .legend .key { font: 700 16px/1 var(--mono); text-align: center; color: #4a4650; }
  .legend .key.red { color: var(--brand); }
  .legend .key.tick { justify-self: center; width: 1.5px; height: 11px; border-radius: 1px; background: rgba(74, 70, 80, 0.8); rotate: 6deg; }
  .legend .key.who { color: #2e74be; }
  .legend .key.line { border-top: 3px dashed #2e74be; height: 0; margin-top: 2px; }
  /* The server's standing, stamped on its card: bare before, inked in once analytics is on. */
  .legend .stamp {
    position: absolute; top: -14px; right: -22px; margin: 0; padding: 5px 7px; border: 1.5px dashed rgba(74, 70, 80, 0.45); border-radius: 4px; background: #fbf7ec;
    font: 600 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(74, 70, 80, 0.7); rotate: 4deg;
  }
  .legend .stamp.on { border: 2px solid var(--brand); color: var(--brand); rotate: -5deg; text-align: center; line-height: 1.25; animation: stamp-down 260ms cubic-bezier(0.32, 0.72, 0, 1); }
  .legend .stamp.on span { display: block; }
  @keyframes stamp-down { from { opacity: 0; scale: 1.5; } }
  html body[data-static] :is(.composer, .clear, .prompts-toggle, .prompts) { display: none; }
  .legend[data-compact] { width: auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .legend[data-compact] :is(p:not(.stamp), ul, .examples-toggle) { display: none; }
  .legend[data-compact] .stamp { position: static; rotate: none; }
  .legend [data-view] { display: none; }
  .legend[data-on="false"] [data-view="before"], .legend[data-on="true"] [data-view="after"] { display: grid; }
  .legend[data-on="false"] .stamp[data-view="before"], .legend[data-on="true"] .stamp[data-view="after"] { display: block; }
  body:has(.story[data-kind="card"]) .legend { display: none; }
  .examples-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin-top: 8px; padding: 0; border: 0; border-top: 1px solid rgba(74, 70, 80, 0.2);
    background: none; color: rgba(21, 27, 46, 0.75); font: 500 13px/1 var(--font); cursor: pointer; text-align: left;
  }
  .examples-toggle .state { font: 600 12px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: #151b2e; color: #fff; }
  .examples-toggle[aria-pressed="false"] .state { background: rgba(21, 27, 46, 0.12); color: #151b2e; }
  .examples-toggle kbd { margin-left: auto; font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 4px; background: rgba(21, 27, 46, 0.08); }
  .examples-toggle:focus-visible { outline: 2px solid #151b2e; outline-offset: 2px; }

  /* Claude's side of the conversation, on the same paper as the map: what was asked, each tool it
     reached for, what came back, and what it said. Open, the map shrinks to sit beside it. */
  .claude {
    position: fixed; right: 24px; top: 84px; bottom: 76px; width: 400px; z-index: 7; display: grid; grid-template-rows: auto 1fr;
    background: #fffdf7; border: 1px solid rgba(74, 70, 80, 0.3); border-radius: 6px; box-shadow: 3px 4px 0 rgba(21, 27, 46, 0.1); color: #151b2e;
  }
  .claude[hidden] { display: none; }
  /* The crossing: the server's side fades in while the conversation settles at the edge, and the
     other way round. Plain animations on the elements themselves, nothing the browser has to stage. */
  body[data-crossing="server"] :is(#stage, .feed, .legend) { animation: fade-in 420ms ease-out backwards; }
  body[data-crossing="server"] .claude { animation: dock-in 420ms cubic-bezier(0.32, 0.72, 0, 1) backwards; }
  body[data-crossing="client"] .claude { animation: fade-in 320ms ease-out backwards; }
  @keyframes fade-in { from { opacity: 0; } }
  /* Each stop arrives with one short rise, so a press reads as a step forward and not a cut. */
  .story-card > :not(.story-logo), .story-caption { animation: stop-in 240ms cubic-bezier(0.32, 0.72, 0, 1) backwards; }
  @keyframes stop-in { from { opacity: 0; transform: translateY(10px); } }
  @keyframes dock-in { from { opacity: 0; transform: translateX(-90px); } }
  .composer { display: none; }
  /* While a level retells the errand, the action being told stands out and what has not happened yet waits. */
  .claude :is(.use, .say) { transition: opacity 200ms ease-out; }
  .claude [data-later] { opacity: 0.22; }
  .claude .use[data-now] { outline: 2px solid var(--brand); outline-offset: 1px; }
  /* What crosses from the customer's side to the server's for one action. */
  .spark { position: fixed; left: 0; top: 0; z-index: 20; padding: 6px 11px; border: 2px solid #fffdf7; border-radius: 999px; box-shadow: 0 2px 0 rgba(21, 27, 46, 0.18); color: #fff; font: 600 13px/1 var(--mono); font-style: normal; white-space: nowrap; pointer-events: none; will-change: transform; }

  /* The customer's side, on its own: a conversation the server takes no part in. Nothing of the
     server is on screen until the talk crosses over. */
  body[data-client] :is(.feed, .legend, .prompts-toggle, .prompts) { display: none; }
  body[data-client] #stage { visibility: hidden; }
  body[data-client] .story-caption { left: max(10vw, 24px); }
  body[data-client] .claude { inset: 150px max(10vw, 24px) 84px; width: auto; grid-template-rows: auto 1fr auto; }
  body[data-client] .claude :is(.min, .back-to-list) { display: none; }
  body[data-client] .claude header { padding: 14px 20px; }
  body[data-client] .claude h2 { font-size: 26px; }
  body[data-client] .claude .server { font-size: 15px; }
  body[data-client] .claude > ol { padding: 18px 20px; }
  body[data-client] .detail .who { grid-template-columns: 40px minmax(0, 1fr) auto; }
  body[data-client] .who .num { width: 40px; height: 40px; font-size: 15px; }
  body[data-client] .who .name { font-size: 16px; }
  body[data-client] .who .said { font-size: 24px; line-height: 1.3; -webkit-line-clamp: 4; }
  body[data-client] .who .status { font-size: 14px; }
  body[data-client] .claude .say { font-size: 20px; }
  body[data-client] .claude .use { font-size: 16px; padding: 9px 12px; }
  body[data-client] .claude .use .back { font-size: 16px; }
  body[data-client] .empty { margin: auto; font: italic 500 22px/1.3 var(--font); color: rgba(21, 27, 46, 0.55); }
  body[data-client] .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 20px 18px; border-top: 1px dashed rgba(74, 70, 80, 0.4); }
  .composer .asks { grid-column: 1 / -1; display: none; flex-wrap: wrap; gap: 8px; }
  body[data-asker] .composer .asks { display: flex; }
  /* The developer's answer is denser than a customer's, so it gets the whole window: what was asked and found on the left, the numbers as a chart on the right. */
  body[data-asker] .claude { inset: 108px 24px 76px; }
  body[data-asker] .detail.charted { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 28px; }
  body[data-asker] .detail.charted .who { grid-column: 1 / -1; }
  body[data-asker] .detail.charted .chart { align-self: start; }
  body[data-asker] .claude .say { font-size: 21px; }
  .composer .asks button { height: 40px; padding: 0 14px; border: 1.5px solid rgba(21, 27, 46, 0.35); border-radius: 999px; background: #fffdf7; color: #151b2e; font: 500 15px/1 var(--font); }
  .composer label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .composer input { min-width: 0; height: 52px; padding: 0 16px; border-radius: 10px; border: 1.5px solid rgba(21, 27, 46, 0.35); background: #fff; color: #151b2e; font: 500 19px/1 var(--font); }
  .composer input:focus-visible { outline: 2px solid #151b2e; outline-offset: 2px; }
  .composer button { height: 52px; padding: 0 22px; border: 0; border-radius: 10px; background: #151b2e; color: #fff; font: 600 17px/1 var(--font); cursor: pointer; transition: scale 150ms ease-out; }
  .composer button:active { scale: 0.97; }
  .composer button:focus-visible { outline: 2px solid #151b2e; outline-offset: 2px; }
  .composer :disabled { opacity: 0.45; cursor: default; }

  /* Docked beside the server, the conversation is the whole right-hand side of the screen, from top to
     bottom, behind a heavy dashed line: the edge of what the server can see. */
  body.beside-claude .claude { inset: 0 0 0 auto; width: 440px; padding: 12px 0 72px 6px; border: 0; border-radius: 0; box-shadow: none; }
  /* Docked, the agent's answer is cut short: it was read in full on the customer's own stop. */
  body.beside-claude .claude .say { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  body.beside-claude .claude::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: repeating-linear-gradient(to bottom, var(--brand) 0 18px, transparent 18px 28px);
  }
  body.beside-claude .claude::before {
    content: "Your server cannot see past this line"; position: absolute; z-index: 1; left: 3px; top: 50%; translate: -50% -50%; rotate: 180deg; writing-mode: vertical-rl;
    padding: 14px 6px; border-radius: 6px; background: var(--brand); color: #fffdf7; font: 600 12px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
  }
  body:has(.story[data-kind="card"]) .claude { display: none; }
  .claude header { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; border-bottom: 1px dashed rgba(74, 70, 80, 0.4); }
  .claude h2 { font: 700 18px/1.2 "Iowan Old Style", "Charter", "Georgia", serif; }
  .claude .server { font: 500 12px/1.3 var(--font); color: rgba(21, 27, 46, 0.65); }
  .claude :is(.min, .clear, .shut, .back-to-list) { border: 0; border-radius: 8px; background: none; color: rgba(21, 27, 46, 0.7); cursor: pointer; transition: color 150ms ease-out, background-color 150ms ease-out; }
  .claude :is(.min, .clear, .shut, .back-to-list, .pick):focus-visible { outline: 2px solid #151b2e; outline-offset: -2px; }
  .claude :is(.min, .clear, .shut, .back-to-list):active { scale: 0.96; }
  @media (hover: hover) and (pointer: fine) {
    .claude :is(.min, .clear, .shut, .back-to-list):hover { color: #151b2e; background: rgba(21, 27, 46, 0.07); }
    .customer .pick:hover { background: rgba(21, 27, 46, 0.035); }
  }
  .claude .min { width: 44px; height: 44px; font: 500 20px/1 var(--mono); }
  .claude .clear { height: 40px; padding: 0 10px; font: 600 13px/1 var(--font); }
  .claude[data-min] .clear { display: none; }
  .claude ol { list-style: none; margin: 0; padding: 0; }
  .claude > ol { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 10px; overflow-y: auto; }

  .customer { display: grid; grid-template-columns: minmax(0, 1fr) 40px; align-items: start; border: 1px solid rgba(74, 70, 80, 0.28); border-radius: 8px; background: #fffefb; }
  .customer .pick { display: grid; gap: 8px; padding: 10px 4px 10px 10px; border: 0; border-radius: 8px 0 0 8px; background: none; color: inherit; text-align: left; cursor: pointer; }
  .customer .shut { width: 40px; height: 44px; display: grid; place-items: center; font: 400 20px/1 var(--font); color: rgba(21, 27, 46, 0.5); }
  .who { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .who .num {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--session, #4a4650); color: #fff;
    font: 700 11px/1 var(--font); letter-spacing: 0.02em;
  }
  .who .num.you { background: #151b2e; font-size: 10px; }
  .who .said { margin: 0; font: italic 500 14px/1.3 var(--font); text-wrap: pretty; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .who .status { font: 600 11px/1 var(--mono); padding: 5px 7px; border-radius: 5px; background: #d3f1e1; color: #14603f; }
  .who .status[data-status="running"] { background: #151b2e; color: #fff; }
  .who .status[data-status="running"]::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--brand); animation: cue-pulse 1.2s ease-in-out infinite; }
  .who .status[data-status="failed"] { background: #ffe1d6; color: #b23a12; }
  .customer .calls { display: flex; flex-wrap: wrap; gap: 5px; padding-left: 36px; min-height: 22px; }
  .customer .call { padding: 4px 7px; border-radius: 5px; background: rgba(21, 27, 46, 0.06); font: 500 12px/1 var(--mono); white-space: nowrap; }
  .customer .call[data-state="error"] { background: #ffe1d6; color: #b23a12; font-weight: 600; }
  .customer .call[data-state="calling"] { animation: cue-pulse 1.2s ease-in-out infinite; }

  .detail { flex: 1 1 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; }
  .detail .back-to-list { justify-self: start; height: 40px; padding: 0 10px; margin-left: -6px; font: 600 13px/1 var(--font); }
  .detail .who { padding: 0 2px; }
  .detail .who .said { -webkit-line-clamp: 4; }
  .claude .talk { min-height: 0; padding: 2px; overflow-y: auto; display: grid; gap: 6px; align-content: start; }
  .claude .talk::-webkit-scrollbar { width: 8px; }
  .claude .talk::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
  .claude .say { font: 500 14px/1.45 var(--font); white-space: pre-wrap; overflow-wrap: anywhere; padding: 2px 2px 4px; }
  .claude .say :is(p, ul) { margin: 0 0 0.55em; }
  .claude .say ul { padding-left: 1.1em; display: grid; gap: 0.25em; }
  .claude .say .next { margin-top: 0.7em; padding: 8px 12px; border-left: 4px solid var(--brand); border-radius: 0 6px 6px 0; background: rgba(245, 78, 0, 0.07); font-weight: 600; }
  .chart { margin: 0; padding: 14px 16px 16px; border: 2px solid #151b2e; border-radius: 12px; box-shadow: 4px 4px 0 #151b2e; background: #fffdf7; }
  .story .charts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: clamp(12px, 1.4vw, 22px); width: 100%; }
  .story .charts li { grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) auto; }
  .chart figcaption { margin-bottom: 12px; font: 700 clamp(15px, 1.4vw, 21px)/1.25 "Iowan Old Style", "Charter", "Georgia", serif; text-wrap: balance; }
  .chart ol { list-style: none; padding: 0; display: grid; gap: 10px; }
  .chart li { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) auto; align-items: center; gap: 10px; font: 500 clamp(13px, 1.1vw, 17px)/1.2 var(--font); }
  .chart .label { text-wrap: balance; }
  .chart .track { display: block; height: 22px; }
  .chart .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--brand); }
  .chart .value { min-width: 2ch; text-align: right; font: 700 clamp(14px, 1.2vw, 19px)/1 var(--mono); font-variant-numeric: tabular-nums; }
  .claude .use { display: grid; grid-template-columns: 16px auto minmax(0, 1fr); align-items: baseline; gap: 2px 8px; padding: 6px 9px; border-radius: 6px; background: rgba(21, 27, 46, 0.05); font: 500 12.5px/1.4 var(--mono); }
  .claude .use .mark { font-weight: 700; text-align: center; color: #1f7a53; }
  .claude .use .name { font-weight: 600; }
  .claude .use .args { color: rgba(21, 27, 46, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .claude .use .back { grid-column: 2 / -1; font: 500 13px/1.35 var(--font); color: #b23a12; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .claude .use[data-state="error"] { background: #ffe9e1; }
  .claude .use[data-state="error"] .mark { color: #b23a12; }
  .claude .use[data-state="calling"] .mark { color: #4a4650; animation: cue-pulse 1.2s ease-in-out infinite; }
  .claude[data-min] { bottom: auto; width: auto; grid-template-rows: auto; }
  .claude[data-min] > ol { display: none; }
  .claude[data-min] header { border-bottom: 0; }
  body.beside-claude .feed { width: calc(100vw - 494px); }
  body.beside-claude .story-caption { right: 470px; }

  /* Bottom dock: the terminal the room already tails, and the sessions view analytics adds beside it. */
  .feed { position: fixed; left: 24px; bottom: 24px; z-index: 6; display: flex; align-items: flex-end; gap: 12px; width: calc(100vw - 330px); }
  body:has(.story[data-kind="card"]) .feed { display: none; }

  .terminal { flex: 0 1 560px; min-width: 500px; border-radius: 10px; overflow: hidden; background: #0d0f14; border: 1px solid #2c303a; color: #c9ccd3; font: 400 13px/1.55 var(--mono); }
  .terminal header { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: #1a1d25; color: #8b909c; font-size: 12px; }
  .terminal header i { width: 10px; height: 10px; border-radius: 50%; background: #3a3f4b; }
  .terminal header span { margin-left: 8px; white-space: nowrap; }
  .terminal ol { list-style: none; padding: 8px 12px 10px; height: calc(6 * 1.55em + 18px); display: flex; flex-direction: column; justify-content: flex-end; }
  /* Columns, so the eye can run down the tools and the results without reading each line. */
  .terminal li { display: grid; grid-template-columns: 8ch 16ch minmax(0, 1fr) 7ch; gap: 2ch; white-space: nowrap; padding: 0 4px; margin: 0 -4px; border-radius: 3px; }
  .terminal .time { color: #6b7080; font-variant-numeric: tabular-nums; }
  .terminal .tool { color: #f2f3f5; font-weight: 600; }
  .terminal .caller { margin-right: 1ch; color: #8fb8e8; }
  .terminal .args { overflow: hidden; text-overflow: ellipsis; color: #9aa0ad; }
  .terminal .result { color: #6fbf8f; text-align: right; }
  .terminal .failed { background: rgba(255, 123, 92, 0.1); }
  .terminal .failed .result { color: #ff7b5c; }
  /* With analytics on, the answers are the thing to read. The log is still there, just no longer the main event. */
  .terminal ol { transition: opacity 600ms ease-out; }
  .terminal[data-aside] ol { opacity: 0.5; }
  /* What agents asked for is answered on the board, so the map does not say it a second time. */
  .notes .list { display: none; }

  /* The session, in the place the log had: the same strip, now about one customer's visit. */
  .terminal[hidden], .visit[hidden] { display: none; }
  .visit { flex: 0 1 560px; min-width: 500px; display: grid; gap: 8px; align-content: start; padding: 10px 12px 12px; border-radius: 10px; border: 1px solid rgba(21, 27, 46, 0.18); border-left: 5px solid var(--session, transparent); background: #fffdf7; color: #151b2e; }
  .visit header { display: flex; align-items: baseline; gap: 10px; font: 600 12px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(21, 27, 46, 0.6); }
  .visit .visitor { min-width: 0; font: 600 15px/1.2 var(--font); letter-spacing: 0; text-transform: none; color: #151b2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .visit .tally { flex: none; }
  .visit .tally { margin-left: auto; font: 500 12px/1 var(--mono); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .visit ol { list-style: none; padding: 0; display: grid; gap: 2px; min-height: calc(7 * 23px); align-content: start; }
  .visit li { display: grid; grid-template-columns: 2ch 15ch minmax(0, 1fr) 6ch 2ch; align-items: baseline; gap: 1.2ch; padding: 1px 5px; border-radius: 3px; font: 500 13px/1.6 var(--mono); }
  .visit .n { text-align: right; color: rgba(21, 27, 46, 0.45); font-variant-numeric: tabular-nums; }
  .visit .tool { font-weight: 600; }
  .visit .sent { color: rgba(21, 27, 46, 0.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .visit .failed .sent { font: 500 13.5px/1.5 var(--font); color: #b23a12; }
  .visit .asked .sent { font: italic 500 14px/1.45 var(--font); color: rgba(21, 27, 46, 0.9); }
  .visit .ms { text-align: right; color: rgba(21, 27, 46, 0.5); font-variant-numeric: tabular-nums; }
  .visit .mark { font-weight: 700; color: #1f7a53; text-align: center; }
  .visit .failed { background: #ffe9e1; }
  .visit .failed .mark { color: #b23a12; }
  .visit li.new { animation: line-up 240ms cubic-bezier(0.32, 0.72, 0, 1); }

  .board { flex: 1 1 660px; min-width: 0; display: grid; gap: 8px; border-radius: 10px; background: #fffdf7; border: 1px solid rgba(21, 27, 46, 0.18); color: #151b2e; padding: 10px 12px 12px; }
  .board header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 600 12px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(21, 27, 46, 0.6); }
  .board .mode { color: rgba(21, 27, 46, 0.6); }
  .board[data-on="true"] .mode { color: var(--brand); }
  .board .q { display: grid; gap: 3px; }
  /* A question with no answer takes one line, so the board grows as the levels answer more. */
  .board .q:has(.unknown) { grid-template-columns: minmax(0, 17em) minmax(0, 1fr); align-items: baseline; gap: 10px; }
  .board .ask { font: 600 13px/1.2 var(--font); color: rgba(21, 27, 46, 0.7); }
  .board .a { border-radius: 4px; display: grid; gap: 5px; font: 500 15px/1.3 var(--font); min-height: 1.3em; }
  .board .unknown { justify-self: start; padding: 1px 7px; border: 1.5px dashed rgba(74, 70, 80, 0.5); border-radius: 4px; color: rgba(74, 70, 80, 0.85); font-weight: 600; }
  .board .detail { color: rgba(21, 27, 46, 0.6); font-size: 13px; }
  .board .a:has(.unknown) { grid-template-columns: auto 1fr; align-items: baseline; gap: 8px; }
  .board .known { font-weight: 600; }
  .board .q[data-wait] { visibility: hidden; }
  /* Level 1 has no traces, so the map shows the server and nothing about its calls. */
  body[data-level="1"] #stage .before { visibility: hidden; }
  body[data-level="1"] .legend li.traced { display: none; }
  .board .user { font-style: normal; font-weight: 600; margin-right: 0.5em; }
  .who .name { font: 600 13px/1.2 var(--font); }
  .board .wanted { font-weight: 500; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .agent { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding-left: 8px; border-left: 4px solid var(--session); }
  .board .goal { font-style: italic; text-wrap: pretty; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .board .more { color: rgba(21, 27, 46, 0.6); font-size: 13px; }
  .board .end { font: 600 12px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: rgba(21, 27, 46, 0.07); white-space: nowrap; }
  .board .end.good { background: #d3f1e1; color: #14603f; }
  .board .end.bad { background: #ffe1d6; color: #b23a12; }
  .board .end.lack { background: #fdebb4; }
  .terminal li.new { animation: line-in 700ms ease-out, line-up 240ms cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes line-up { from { opacity: 0; transform: translateY(8px); } }
  .board .enter { animation: row-in 280ms cubic-bezier(0.32, 0.72, 0, 1) backwards; }
  /* The one line is the hinge of the talk, so it is written out once as the stop opens. */
  .story .code code:first-child { animation: type-in 1000ms steps(34, end) 200ms backwards; }
  .story .code code.alt { animation: row-in 280ms cubic-bezier(0.32, 0.72, 0, 1) 1200ms backwards; }
  @keyframes type-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes line-in { from { background: rgba(255, 255, 255, 0.16); } }

  .story-nav .cue { margin-right: 10px; padding: 7px 10px; border-radius: 999px; background: rgba(21, 27, 46, 0.08); color: #151b2e; }
  .story-nav .cue:empty { display: none; }
  .story-nav .cue[data-busy] { background: #151b2e; color: #fff; }
  .story-nav .cue[data-busy]::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--brand); animation: cue-pulse 1.2s ease-in-out infinite; }
  @keyframes cue-pulse { 50% { opacity: 0.25; } }

  .chip.prompts-toggle { display: none; }
  .prompts {
    position: fixed; top: 80px; right: 24px; z-index: 10; width: min(460px, calc(100vw - 48px));

  @media (hover: hover) and (pointer: fine) { .prompt:hover { background: rgba(255, 255, 255, 0.09); } }

  @media (prefers-reduced-motion: reduce) {
    .prompt, .prompts-form button, .story-nav button, .claude button { transition: none; }
    .legend .stamp.on, .story-nav .cue[data-busy]::before, .terminal li.new, .visit li.new, .claude .use[data-state="calling"] .mark, .customer .call[data-state="calling"], .who .status[data-status="running"]::before { animation: none; }

  }
</style>
